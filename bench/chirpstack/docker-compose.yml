# ChirpStack v4 for the DownlinkScope test bench.
#
# Based on docker-compose.yml of chirpstack-docker (MIT licence, see
# LICENSE.chirpstack-docker and UPSTREAM.md).
#
# Differences from the upstream file:
#   - exact image versions for the two ChirpStack components;
#   - no Basics Station bridge and no REST API (not used by the bench);
#   - UDP 1700 is published only on the address of the bench network;
#   - the web interface and MQTT are published only on 127.0.0.1;
#   - no automatic restart, so nothing starts again without a command.
#
# Start this file with bench/bench.sh, not directly: the script creates the
# file .env and checks that the bench network exists.

name: dls

services:
  chirpstack:
    image: chirpstack/chirpstack:4.20.1
    command: -c /etc/chirpstack
    restart: "no"
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack:ro
    depends_on:
      - postgres
      - mosquitto
      - redis
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      - CHIRPSTACK_API_SECRET=${CHIRPSTACK_API_SECRET:?run bench/bench.sh up}
    ports:
      - "127.0.0.1:8080:8080"

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4.1.2
    restart: "no"
    ports:
      - "${DLS_SERVER_IP:?run bench/bench.sh up}:1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  postgres:
    image: postgres:14-alpine
    restart: "no"
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d:ro
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack

  redis:
    image: redis:7-alpine
    restart: "no"
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: "no"
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./configuration/mosquitto/config/:/mosquitto/config/:ro

volumes:
  postgresqldata:
  redisdata:
